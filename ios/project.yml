name: Flamingo
options:
  bundleIdPrefix: org.flamingo.local
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  minimumXcodeGenVersion: '2.42.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '2.3.1'
    CURRENT_PROJECT_VERSION: '6'
packages:
  FlamingoCore:
    path: Packages/FlamingoCore
targets:
  Flamingo:
    type: application
    platform: iOS
    sources:
      - path: Flamingo
        excludes:
          - Resources
          - Info.plist
      - path: Flamingo/Resources
        buildPhase: resources
    dependencies:
      - package: FlamingoCore
      - framework: Build/Decoder/FlamingoDecoder.xcframework
        embed: false
      - sdk: AudioToolbox.framework
      - sdk: CoreFoundation.framework
      - sdk: libiconv.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.flamingo.local.player
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Flamingo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: Flamingo/Info.plist
      properties:
        CFBundleDisplayName: music
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  FlamingoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlamingoTests
        excludes: [Fixtures]
      - path: FlamingoTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Flamingo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.flamingo.local.player.tests
  FlamingoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FlamingoUITests]
    dependencies:
      - target: Flamingo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.flamingo.local.player.uitests
schemes:
  Flamingo:
    build:
      targets:
        Flamingo: all
        FlamingoTests: [test]
        FlamingoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [FlamingoTests, FlamingoUITests]
    archive:
      config: Release
